# Frozen config for the pretrained checkpoint `celeba_box`.
# CelebA 128 - centered 40x40 box inpainting, sigma=0.05
# Generated by scripts/make_release_assets.py from the config the model was
# trained with -- edit the dataset paths, nothing else.
experiment:
  stage: box_inpainting
  phase: test
  seed: 42
  run_id: null
paths:
  output_root: ./results
data:
  root: ./data/celeba
  size: 128
  grayscale: false
  normalize: true
  recursive: false
  center_crop: true
  crop_size: 178
  max_len: null
dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: false
  shuffle_train: true
distributed:
  use_ddp: false
  backend: nccl
  gpus:
  - 0
  master_addr: localhost
  master_port: 47869
logging:
  log_every: 1
  save_every: 5
  save_img_every: 5
  keep_last_n: 0
  val_seed: 1234
training:
  epochs: 200
  steps_per_epoch: 1000
  lr: 0.0002
  lr_min: 1.0e-06
  lr_schedule: cosine
  weight_decay: 0.0001
  grad_clip: 1.0
  use_ema: false
  ema_decay: 0.9999
  ema_start_epoch: 4
snap:
  source: posterior
  cond_anchor: aty
  tau: 0.3
  p_ratio: 0.5
  corner_frac: 0.1
  logit_mu: 0.0
  logit_sigma: 1.0
  weight_p: 1.0
  weight_c: 0.001
  weight_norm: ema
  weight_norm_decay: 0.99
  beta: 0.0
  gamma_max: 10000.0
  t_eps: 0.001
model:
  resume_path: null
  in_ch: 3
  out_ch: 3
  input_height: 128
  ch: 64
  ch_mult:
  - 1
  - 2
  - 2
  - 2
  num_res_blocks: 2
  attn_resolutions:
  - 16
  resamp_with_conv: true
  cond_r: true
  cond_sigma: true
  sigma_emb_scale: 10.0
sample:
  steps: 1
methods:
  box_inpainting:
    block_center: true
    block_size: 40
    mask_channels: shared
    mask_type: box
    noise: 0.05
    same_mask_across_batch: false
