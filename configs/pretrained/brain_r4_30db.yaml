# Frozen config for the pretrained checkpoint `brain_r4_30db`.
# fastMRI brain - multi-coil CS-MRI, R=4, 30 dB
# Generated by scripts/make_release_assets.py from the config the model was
# trained with -- edit the dataset paths, nothing else.
experiment:
  stage: cs_mri
  phase: test
  seed: 42
  run_id: null
paths:
  output_root: ./results
data:
  loader: fastmri_brain
  image_size:
  - 320
  - 320
  normalize: max
  max_len: null
  raw_dir: ./data/fastmri_brain_multicoil
  maps_dir: ./data/fastmri_brain_multicoil/real/acceleration_rate_1_smps_hat_method_eps
  index_json: ./data/index_AXT2_320.json
  crop: 320
  slice_start: 4
  slice_end: -5
  max_coils: 20
  cache_dir: ./data/fastmri_brain_cache320
dataloader:
  batch_size: 4
  num_workers: 8
  pin_memory: false
  shuffle_train: true
distributed:
  use_ddp: false
  backend: nccl
  gpus:
  - 0
  master_addr: localhost
  master_port: 51811
logging:
  log_every: 1
  save_every: 5
  save_img_every: 5
  keep_last_n: 0
  val_seed: 1234
training:
  epochs: 80
  steps_per_epoch: 2152
  lr: 0.0001
  lr_min: 1.0e-06
  lr_schedule: cosine
  weight_decay: 0.0001
  grad_clip: 1.0
  grad_accum_steps: 1
  use_ema: false
  ema_decay: 0.9998
  ema_start_epoch: 4
snap:
  source: posterior
  cond_anchor: aty
  tau: 0.25
  p_ratio: 0.5
  corner_frac: 0.1
  logit_mu: 0.0
  logit_sigma: 1.0
  weight_p: 1.0
  weight_c: 0.001
  t_eps: 0.001
model:
  resume_path: null
  in_ch: 2
  out_ch: 2
  input_height: 320
  ch: 32
  ch_mult:
  - 1
  - 2
  - 4
  - 8
  - 8
  num_res_blocks: 4
  attn_resolutions:
  - 40
  resamp_with_conv: true
  cond_r: true
  cond_sigma: true
  sigma_emb_scale: 10.0
sample:
  steps: 1
methods:
  cs_mri:
    acceleration_ratio: 4
    cg_iters: 200
    image_size: 320
    input_snr_db: 30
    mask_seed: 0
    noise: 0.0036
    orientation: vertical
    pattern: random
    random_mask: false
    total_lines: 320
