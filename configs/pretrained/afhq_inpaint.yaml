# Frozen config for the pretrained checkpoint `afhq_inpaint`.
# AFHQ-Cat 256 - random inpainting, 70% pixels missing, sigma=0.01
# Generated by scripts/make_release_assets.py from the config the model was
# trained with -- edit the dataset paths, nothing else.
experiment:
  stage: inpainting
  phase: test
  seed: 42
  run_id: null
paths:
  output_root: ./results
data:
  root: ./data/afhq_cat
  size: 256
  grayscale: false
  normalize: true
  recursive: false
  center_crop: false
  crop_size: 178
  max_len: null
  augment_hflip: true
dataloader:
  batch_size: 2
  num_workers: 4
  pin_memory: false
  shuffle_train: true
distributed:
  use_ddp: false
  backend: nccl
  gpus:
  - 0
  master_addr: localhost
  master_port: 40331
logging:
  log_every: 5
  validate: true
  save_every: 5
  save_img_every: 5
  keep_last_n: 0
  val_seed: 1234
training:
  epochs: 80
  steps_per_epoch: 2000
  lr: 0.0002
  lr_min: 1.0e-06
  lr_schedule: cosine
  weight_decay: 0.0001
  grad_clip: 1.0
  grad_accum_steps: 4
  use_ema: false
  ema_decay: 0.9999
  ema_start_epoch: 20
snap:
  source: posterior
  cond_anchor: aty
  tau: 0.1
  p_ratio: 0.5
  corner_frac: 0.1
  logit_mu: 0.0
  logit_sigma: 1.0
  weight_p: 1.0
  weight_c: 0.001
  weight_norm: ema
  weight_norm_decay: 0.99
  beta: 0.0
  gamma_max: 10000.0
  t_eps: 0.001
model:
  resume_path: null
  in_ch: 3
  out_ch: 3
  input_height: 256
  ch: 64
  ch_mult:
  - 1
  - 2
  - 4
  - 4
  - 8
  - 8
  num_res_blocks: 2
  attn_resolutions:
  - 32
  - 16
  dropout: 0.1
  resamp_with_conv: true
  cond_r: true
  cond_sigma: true
  sigma_emb_scale: 10.0
sample:
  steps: 1
methods:
  inpainting:
    drop_prob: 0.7
    mask_channels: shared
    mask_seed: 42
    mask_type: random
    noise: 0.01
    same_mask_across_batch: true
